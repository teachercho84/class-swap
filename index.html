<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 시간표 교체</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1 id="pageTitle">수업 시간표 교체</h1>
      <div class="sub" id="pageSub">데이터를 불러오는 중…</div>
    </div>
    <div class="teacher-picker">
      <label for="teacherSelect">교사</label>
      <select id="teacherSelect" disabled><option>불러오는 중…</option></select>
    </div>
  </header>

  <div id="errorBanner"></div>

  <div id="appBody" style="display:none;">
    <div id="absencePanel" class="absence-panel">
      <div class="absence-panel-head">
        <span class="absence-panel-title">출장·결근 관리</span>
        <div class="absence-panel-controls">
          <select id="absenceDaySelect"></select>
          <span class="absence-period-checks" id="absencePeriodChecks">
            <label><input type="checkbox" id="absencePeriodAll"> 전체</label>
            <label><input type="checkbox" value="1"> 1</label>
            <label><input type="checkbox" value="2"> 2</label>
            <label><input type="checkbox" value="3"> 3</label>
            <label><input type="checkbox" value="4"> 4</label>
            <label><input type="checkbox" value="5"> 5</label>
            <label><input type="checkbox" value="6"> 6</label>
            <label><input type="checkbox" value="7"> 7</label>
          </span>
          <button type="button" id="absenceAddBtn">추가</button>
          <button type="button" id="absenceResetBtn">초기화</button>
          <button type="button" id="absenceSaveBtn">저장하기</button>
        </div>
      </div>
      <div id="absenceTagList" class="absence-tag-list"></div>
    </div>

    <div class="legend">
      <span><i class="swatch normal"></i>일반 수업</span>
      <span><i class="swatch move"></i>이동수업</span>
    </div>

    <div class="main-row">
      <div class="board-col">
        <div class="board-scroll">
          <table class="board" id="boardTable"></table>
        </div>
      </div>
      <div class="side-col">
        <div id="sidePanel" class="side-panel">
          <div class="placeholder">칸을 클릭하면 교체·대강 후보가 여기에 표시됩니다.</div>
        </div>
      </div>
    </div>

    <section id="previewSection" class="preview-section" style="display:none;">
      <div class="preview-head">
        <h2>변경 후 시간표 미리보기</h2>
        <button type="button" class="preview-close" id="previewCloseBtn" aria-label="미리보기 닫기">&times;</button>
      </div>
      <div class="preview-cols" id="previewStaticCols">
        <div class="preview-col">
          <div class="preview-col-title" id="previewLeftTitle"></div>
          <div class="board-scroll"><table class="board mini-board" id="previewLeftBoard"></table></div>
        </div>
        <div class="preview-col">
          <div class="preview-col-title" id="previewRightTitle"></div>
          <div class="board-scroll"><table class="board mini-board" id="previewRightBoard"></table></div>
        </div>
      </div>
      <div id="previewComboRows" class="preview-combo-rows" style="display:none;"></div>
    </section>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
